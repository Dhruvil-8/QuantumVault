[package]
name    = "quantumvault-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quantumvault-core = { path = "../quantumvault-core" }
wasm-bindgen      = "0.2"
js-sys            = "0.3"
serde-wasm-bindgen = "0.6"
getrandom         = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[features]
default = []
