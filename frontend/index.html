<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumVault - Post-Quantum File Encryption</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="gradient-text">QuantumVault</h1>
            <p class="subtitle">Post-Quantum Secure File Storage</p>
        </header>

        <main>
            <!-- Identity Manager Panel -->
            <section class="glass-card">
                <h2>My Identity</h2>
                <p class="description">Generate a new post-quantum cryptographic identity (ML-KEM-1024 + ML-DSA-65 + X25519).</p>
                
                <div class="input-group">
                    <label for="identity-path">Identity Directory</label>
                    <div class="input-row">
                        <input type="text" id="identity-path" placeholder="No directory selected" readonly>
                        <button type="button" id="btn-generate-identity" class="btn btn-primary">Generate New</button>
                    </div>
                </div>
                
                <div id="identity-status" class="status-box hidden"></div>
            </section>

            <!-- File Operations Panel -->
            <section class="glass-card">
                <!-- Navigation Tabs -->
                <div class="tabs">
                    <button type="button" id="tab-encrypt" class="tab active">Encrypt</button>
                    <button type="button" id="tab-decrypt" class="tab">Decrypt</button>
                </div>

                <form id="file-ops-form">
                    <!-- Source File / Vault File -->
                    <div class="input-group">
                        <label id="lbl-source-file" for="input-file">Source File</label>
                        <div class="input-row">
                            <input type="text" id="input-file" placeholder="Select a file..." readonly required>
                            <button type="button" id="btn-browse-input" class="btn btn-secondary">Browse</button>
                        </div>
                    </div>

                    <!-- Output File / Decrypted File -->
                    <div class="input-group">
                        <label id="lbl-output-file" for="output-file">Output Vault (.qvault)</label>
                        <div class="input-row">
                            <input type="text" id="output-file" placeholder="Choose where to save..." readonly required>
                            <button type="button" id="btn-browse-output" class="btn btn-secondary">Browse</button>
                        </div>
                    </div>

                    <!-- Key Paths Grid -->
                    <div class="grid-row">
                        <!-- Sender Path -->
                        <div class="input-group">
                            <label id="lbl-sender-key" for="sender-key-path">My Identity (Sender)</label>
                            <div class="input-row">
                                <input type="text" id="sender-key-path" placeholder="Select directory..." readonly required>
                                <button type="button" id="btn-select-sender" class="btn btn-secondary">Select</button>
                            </div>
                        </div>

                        <!-- Recipient Path -->
                        <div class="input-group">
                            <label id="lbl-recipient-key" for="recipient-key-path">Recipient Public Key (Encryption Dir)</label>
                            <div class="input-row">
                                <input type="text" id="recipient-key-path" placeholder="Select directory..." readonly required>
                                <button type="button" id="btn-select-recipient" class="btn btn-secondary">Select</button>
                            </div>
                        </div>
                    </div>

                    <!-- Execute Button -->
                    <button type="button" id="btn-execute" class="btn btn-action">Encrypt File</button>
                </form>

                <div id="ops-status" class="status-box hidden"></div>
            </section>
        </main>
    </div>
</body>
</html>
