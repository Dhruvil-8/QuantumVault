[package]
name = "quantumvault-core"
version = "2.0.0"
edition = "2024"
description = "Core cryptography and vault library for QuantumVault"
license = "MIT"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"

# Classical crypto (X25519 for hybrid security)
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

# Key Derivation
hkdf = "0.12"
sha3 = "0.10"

# Memory safety
zeroize = { version = "1.8", features = ["derive"] }

# Post-quantum crypto (Pure Rust - NIST FIPS 203/204)
fips203 = "0.4"
fips204 = "0.4"

# AEAD encryption
chacha20poly1305 = { version = "0.10", features = ["alloc"] }

# Constant-time comparison for security-critical operations
subtle = "2.6"

# Hex encoding for key display
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
